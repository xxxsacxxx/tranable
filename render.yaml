databases:
  - name: tranable-db
    plan: free
    databaseName: tranable
    user: tranable

services:
  - type: web
    name: tranable-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tranable-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://tranable-frontend.onrender.com

  - type: web
    name: tranable-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tranable-backend.onrender.com
