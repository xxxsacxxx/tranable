# Render Blueprint — deploys the whole Tranable demo (Postgres + FastAPI backend + Next.js
# frontend) from one repo. In the Render dashboard: New -> Blueprint -> select this repo.
#
# Notes:
# - The free Postgres plan expires 30 days after creation (then a 14-day grace period) —
#   fine for a demo; recreate the blueprint or upgrade the plan for anything longer-lived.
# - Free web services spin down after 15 minutes of inactivity and take ~1 minute to wake
#   on the next request — the first click after idle time will be slow, that's expected.
# - NEXT_PUBLIC_API_URL below assumes the backend service name stays "tranable-backend"
#   (Render's default public URL is https://<service-name>.onrender.com). If you rename
#   the service, update this value to match.

databases:
  - name: tranable-db
    plan: free
    databaseName: tranable
    user: tranable

services:
  - type: web
    name: tranable-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "python -m app.create_tables && python seed/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tranable-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://tranable-frontend.onrender.com

  - type: web
    name: tranable-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tranable-backend.onrender.com
